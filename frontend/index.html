<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>矿井瓦斯班测台</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #1c1917; color: #f5f5f4; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #44403c; }
    main { max-width: 760px; margin: 20px auto; padding: 0 12px; }
    input, button { padding: 8px; margin-right: 8px; }
    .alarm { color: #fca5a5; } .ok { color: #86efac; }
    #live { min-height: 1.4em; }
    table { width: 100%; border-collapse: collapse; }
    td, th { border-bottom: 1px solid #57534e; padding: 6px; text-align: left; }
    pre { background: #292524; padding: 12px; white-space: pre-wrap; }
    code { color: #fbbf24; }
  </style>
</head>
<body>
  <header>
    <strong>矿井瓦斯班测台</strong>
    <span id="who"></span>
    <button id="out" hidden>退出</button>
  </header>
  <main>
    <section id="login">
      <p>检查员上报测点甲烷，达到 1% 会立刻推到已打开的页面。这不是图表看板。</p>
      <input id="user" value="gasman" />
      <input id="pass" type="password" value="gas123456" />
      <button id="go">登录</button>
      <p>gasman / gas123456 可上报；viewer / view123456 只能看</p>
    </section>
    <section id="app" hidden>
      <p id="live">等待推送</p>
      <form id="form">
        <input id="site" placeholder="测点" />
        <input id="ch4" type="number" step="0.01" placeholder="甲烷 %" />
        <button>上报</button>
      </form>
      <table><thead><tr><th>测点</th><th>甲烷 %</th><th>状态</th><th>说明</th><th id="correct-col">改正</th></tr></thead><tbody id="rows"></tbody></table>
      <h2>推送抄本</h2>
      <p>每次达到报警线推送时单独存档，正文与校验短串冻结于推送当时，事后改正浓度不影响已生成的抄本。</p>
      <table>
        <thead><tr><th>抄本号</th><th>测点</th><th>甲烷 %</th><th>状态</th><th>校验短串</th><th>推送时间</th><th>操作</th></tr></thead>
        <tbody id="transcripts"></tbody>
      </table>
      <section id="transcript-detail" hidden>
        <h3>抄本详情</h3>
        <pre id="transcript-body"></pre>
      </section>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
